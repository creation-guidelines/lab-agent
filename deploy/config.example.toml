# Copy to /etc/lab-agent/config.toml and fill in the two remotes. Everything else has a sensible default (see lab_agent/config.py
# for all of them and what each does); only override what you actually need to change.

[jobs]
remote = "git@github.com:YOUR_ORG/YOUR_JOBS_REPO.git"
# branch = "main"

[results]
remote = "git@github.com:YOUR_ORG/YOUR_RESULTS_REPO.git"
# branch = "results"

# Read-only deploy key for the jobs repo, and a separate deploy key with write access ONLY to the results repo. Never the
# same key for both: a leaked results key must not be able to make this machine run anything.
ssh_key_jobs = "/etc/lab-agent/jobs_deploy_key"
ssh_key_results = "/etc/lab-agent/results_deploy_key"

# Anything a job script might need that should not be committed into the jobs repo (device serial numbers, paths that are
# specific to this one machine). Jobs read these as ordinary environment variables.
[extra_env]
# PHONE_SERIAL = "abcdef1234"
