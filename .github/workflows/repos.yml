name: Package repository

# A signed pacman repository on GitHub Pages, rebuilt after every verified release (or by hand),
# so `pacman -Syu` picks up lab-agent updates with the rest of the system.
#
# The signing key is the secret REPO_SIGNING_KEY. It is used in exactly two steps, both through
# Building, signing, checking and publishing live in the package conveyor; this repository keeps its
# declaration (packaging/conveyor.toml), its public key and its install test.
# the project's code: the Arch package is built in an earlier job that has no access to the
# secret. Pages deploys only from main. Nothing is deployed unless
#
# After the deploy, the README's own repo-pacman snippet is run on a real Arch container against
# the live repository (the verify job).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default is the latest release)
        required: false

permissions:
  contents: read

concurrency:
  group: package-repository
  cancel-in-progress: false

env:
  # Must be the fingerprint of packaging/repo/lab-agent-repo.asc: check-site.sh fails if not.
  FINGERPRINT: B345BA33340C75FB327B22CCDD5D5430E6BA4289

jobs:
  tag:
    name: which release?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The release tag to publish, if one was cut
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="${INPUT_TAG:-$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | grep -o '"tag_name": *"v[0-9.]*"' | grep -o 'v[0-9.]*')}"
          else
            tag="$(git tag --points-at "$HEAD_SHA" | grep -E '^v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (a push that cut no release)}"

  # Built with no access to the signing key: this runs the project's own PKGBUILD (and so its code).
  publish:
    name: the package conveyor
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
