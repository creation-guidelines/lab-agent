name: Package repository

# A signed pacman repository on GitHub Pages, rebuilt after every verified release (or by hand),
# so `pacman -Syu` picks up lab-agent updates with the rest of the system.
#
# The signing key is the secret REPO_SIGNING_KEY. It is used in exactly two steps, both through
# packaging/repo/with-key.sh, which checks its fingerprint first, and neither step builds or runs
# the project's code: the Arch package is built in an earlier job that has no access to the
# secret. Pages deploys only from main. Nothing is deployed unless
# packaging/repo/check-site.sh verifies every signature on the assembled site.
#
# After the deploy, the README's own repo-pacman snippet is run on a real Arch container against
# the live repository (the verify job).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default is the latest release)
        required: false

permissions:
  contents: read

concurrency:
  group: package-repository
  cancel-in-progress: false

env:
  # Must be the fingerprint of packaging/repo/lab-agent-repo.asc: check-site.sh fails if not.
  FINGERPRINT: B345BA33340C75FB327B22CCDD5D5430E6BA4289

jobs:
  tag:
    name: which release?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The release tag to publish, if one was cut
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="${INPUT_TAG:-$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | grep -o '"tag_name": *"lab-agent-v[0-9.]*"' | grep -o 'lab-agent-v[0-9.]*')}"
          else
            tag="$(git tag --points-at "$HEAD_SHA" | grep -E '^lab-agent-v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (a push that cut no release)}"

  # Built with no access to the signing key: this runs the project's own PKGBUILD (and so its code).
  arch-build:
    name: build the Arch package
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build it from the release's own PKGBUILD, in an Arch container
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          mkdir -p out
          cat > build.sh <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel sudo curl >/dev/null
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sudo -Hu builder env TAG="$TAG" REPO="$REPO" bash -euo pipefail -c '
            mkdir ~/b && cd ~/b
            curl -fsSL -o PKGBUILD "https://github.com/$REPO/releases/download/$TAG/PKGBUILD"
            makepkg -s --noconfirm'
          cp /home/builder/b/lab-agent-[0-9]*.pkg.tar.zst /out/
          SH
          docker run --rm -e TAG -e REPO="$GITHUB_REPOSITORY" -v "$PWD/build.sh:/build.sh:ro" -v "$PWD/out:/out" archlinux:latest bash /build.sh
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: out/*.pkg.tar.zst

  # Signs and indexes the built package. This job has the key and runs only gpg and repo-add.
  arch-sign:
    name: sign the Arch repository
    needs: [tag, arch-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: pkg
      - name: Sign (this step has the key)
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          mkdir -p arch-out
          docker run --rm -e REPO_SIGNING_KEY -e FINGERPRINT -v "$PWD:/w" -w /w archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed gnupg >/dev/null
            bash packaging/repo/with-key.sh bash packaging/repo/build-arch.sh arch-out/x86_64 pkg/lab-agent-[0-9]*.pkg.tar.zst
            chmod -R a+rX arch-out'
      - uses: actions/upload-artifact@v7
        with:
          name: arch-repo
          path: arch-out

  publish:
    name: sign, check and publish
    needs: [tag, arch-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arch-repo
          path: arch-out
      - name: The front page, the key, and the Arch repository
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          bash packaging/repo/site.sh site README.md "${TAG#lab-agent-v}"
          mkdir -p site/arch && cp -r arch-out/. site/arch/
      - name: Nothing is deployed unless every signature verifies
        run: bash packaging/repo/check-site.sh site "$FINGERPRINT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  # The README's repo-pacman snippet, on a real Arch container, against what was just published.
  verify:
    name: pacman repo, real install
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - name: A user's tools
        run: pacman -Syu --noconfirm --needed sudo curl gawk && pacman-key --init && pacman-key --populate archlinux
      - name: Run the README's repository snippet, then update the way a person does
        env:
          SCRIPT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/packaging/test/repo-snippet.sh
        run: curl -fsSL "$SCRIPT" -o /tmp/repo-snippet.sh && bash /tmp/repo-snippet.sh
