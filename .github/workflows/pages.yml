name: pages

# Publishes rustdoc API docs to GitHub Pages. Simpler than the tad-based site builder other
# creation-guidelines repos use: lab-agent is a CLI tool, not an RFC-style docs project, so plain
# `cargo doc` output is the right fit here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
      - run: echo '<meta http-equiv="refresh" content="0; url=lab_agent/index.html">' > target/doc/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v4
