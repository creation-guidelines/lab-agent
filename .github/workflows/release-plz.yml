name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build binaries for, e.g. v0.1.0
        required: true
      dry-run:
        description: Build only, keep the files as an artifact - attach and attest nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: MarcoIeni/release-plz-action@v0.5
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the release tag, if this push cut one
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  deliver:
    name: binaries and PKGBUILD (the package conveyor)
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/binaries.yml@v1
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
      upload: ${{ !inputs.dry-run }}
