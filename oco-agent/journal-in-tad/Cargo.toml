[package]
name = "oco-agent-journal-in-tad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "oco-agent's journal kept in tad tables: files you can read, text you can reshape, a table you can ask in SQL"
license = "MIT"
publish = false

[dependencies]
oco-agent-core = { path = "../core" }
tad = { git = "https://github.com/creation-guidelines/tad-engine", tag = "tad-v0.5.0" }
serde_json = "1"
toml = "0.8"
