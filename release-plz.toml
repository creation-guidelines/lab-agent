[workspace]
changelog_config = "cliff.toml"
dependencies_update = false
# lab-agent is distributed as binaries and distro packages, not through crates.io.
publish = false
git_only = true
git_tag_enable = true
git_release_enable = false

[[package]]
name = "lab-agent"
git_release_enable = true

# oco-agent grows here beside lab-agent; it is not released until it takes over.
[[package]]
name = "oco-agent-core"
release = false

[[package]]
name = "oco-agent-journal-in-tad"
release = false

[[package]]
name = "oco-agent-replay"
release = false

[[package]]
name = "oco-agent"
release = false
