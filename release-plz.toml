[workspace]
changelog_config = "cliff.toml"
dependencies_update = false
# lab-agent is distributed as binaries and distro packages, not through crates.io.
publish = false
git_only = true
git_tag_enable = true
git_release_enable = false

[[package]]
name = "lab-agent"
# pinned: a workspace would otherwise tag as lab-agent-vX, which the delivery (tag-prefix "v") does not see
git_tag_name = "v{{ version }}"
git_release_enable = true

# oco-agent grows here beside lab-agent; it is not released until it takes over.
[[package]]
name = "oco-agent-core"
release = false
# its own tag name: sharing lab-agent's (v{{ version }}) made release-plz look for it at lab-agent's tags
git_tag_name = "oco-agent-core-v{{ version }}"

[[package]]
name = "oco-agent-journal-in-tad"
release = false
# its own tag name: sharing lab-agent's (v{{ version }}) made release-plz look for it at lab-agent's tags
git_tag_name = "oco-agent-journal-in-tad-v{{ version }}"

[[package]]
name = "oco-agent-replay"
release = false
# its own tag name: sharing lab-agent's (v{{ version }}) made release-plz look for it at lab-agent's tags
git_tag_name = "oco-agent-replay-v{{ version }}"

[[package]]
name = "oco-agent"
release = false
# its own tag name: sharing lab-agent's (v{{ version }}) made release-plz look for it at lab-agent's tags
git_tag_name = "oco-agent-v{{ version }}"

[[package]]
name = "oco-agent-github"
release = false
# its own tag name: sharing lab-agent's (v{{ version }}) made release-plz look for it at lab-agent's tags
git_tag_name = "oco-agent-github-v{{ version }}"
