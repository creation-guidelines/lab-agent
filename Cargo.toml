[package]
name = "lab-agent"
version = "0.1.4"
edition = "2021"
description = "Pull-based job runner: polls a git repo for jobs, runs them on real hardware, reports results through git."
license = "MIT"

[[bin]]
name = "lab-agent"
path = "src/main.rs"

[dependencies]
argenv = "0.3"
argenv-resolve = "0.3"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rpassword = "7"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
nix = { version = "0.29", features = ["process", "signal", "user"] }

[profile.release]
opt-level = 2

[package.metadata.deb]
name = "lab-agent"
maintainer = "creation-guidelines"
copyright = "2026, creation-guidelines"
extended-description = """\
A pull-based job runner for hardware-in-the-loop work: polls a git repo for \
job scripts, runs them on whatever machine it's installed on, and reports \
results through git."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/lab-agent", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lab-agent/README.md", "644"],
    ["LICENSE", "usr/share/doc/lab-agent/LICENSE", "644"],
    # Generated from the contract by packaging/build-packages.sh.
    ["packaging/generated/lab-agent.bash", "usr/share/bash-completion/completions/lab-agent", "644"],
    ["packaging/generated/_lab-agent", "usr/share/zsh/site-functions/_lab-agent", "644"],
    ["packaging/generated/lab-agent.fish", "usr/share/fish/vendor_completions.d/lab-agent.fish", "644"],
    ["packaging/generated/lab-agent.nu", "usr/share/nushell/vendor/autoload/lab-agent.nu", "644"],
    ["packaging/generated/lab-agent.1.gz", "usr/share/man/man1/lab-agent.1.gz", "644"],
]

[package.metadata.generate-rpm]
name = "lab-agent"
summary = "Pull-based job runner for hardware-in-the-loop work"
assets = [
    { source = "target/release/lab-agent", dest = "/usr/bin/lab-agent", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/lab-agent/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/lab-agent/LICENSE", mode = "644", doc = true },
    # Generated from the contract by packaging/build-packages.sh.
    { source = "packaging/generated/lab-agent.bash", dest = "/usr/share/bash-completion/completions/lab-agent", mode = "644" },
    { source = "packaging/generated/_lab-agent", dest = "/usr/share/zsh/site-functions/_lab-agent", mode = "644" },
    { source = "packaging/generated/lab-agent.fish", dest = "/usr/share/fish/vendor_completions.d/lab-agent.fish", mode = "644" },
    { source = "packaging/generated/lab-agent.nu", dest = "/usr/share/nushell/vendor/autoload/lab-agent.nu", mode = "644" },
    { source = "packaging/generated/lab-agent.1.gz", dest = "/usr/share/man/man1/lab-agent.1.gz", mode = "644", doc = true },
]
