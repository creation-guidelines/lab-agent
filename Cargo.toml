[package]
name = "lab-agent"
version = "0.1.2"
edition = "2021"
description = "Pull-based job runner: polls a git repo for jobs, runs them on real hardware, reports results through git."
license = "MIT"

[[bin]]
name = "lab-agent"
path = "src/main.rs"

[dependencies]
argenv = "0.3"
argenv-resolve = "0.3"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rpassword = "7"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
nix = { version = "0.29", features = ["process", "signal", "user"] }

[profile.release]
opt-level = 2

[package.metadata.deb]
name = "lab-agent"
maintainer = "creation-guidelines"
copyright = "2026, creation-guidelines"
extended-description = """\
A pull-based job runner for hardware-in-the-loop work: polls a git repo for \
job scripts, runs them on whatever machine it's installed on, and reports \
results through git."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/lab-agent", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lab-agent/README.md", "644"],
    ["LICENSE", "usr/share/doc/lab-agent/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "lab-agent"
summary = "Pull-based job runner for hardware-in-the-loop work"
assets = [
    { source = "target/release/lab-agent", dest = "/usr/bin/lab-agent", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/lab-agent/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/lab-agent/LICENSE", mode = "644", doc = true },
]
