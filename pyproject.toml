[project]
name = "lab-agent"
version = "0.1.0"
description = "A pull-based agent for a lab machine: runs the scripts it finds in a git repository, one at a time, and reports progress back through git."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 160
# kit/ is a copy of the generic kit maintained in creation-guidelines/ideal-project-playbook, not this project's own
# code; it has its own tests (run by dev/run_tests.py) but its style is not this repository's to enforce.
extend-exclude = ["kit"]  # this project's docstrings and asserts are deliberately long, explanatory sentences; see playbook/07-words-and-output.rst

[tool.ruff.lint]
# The explicit set, rather than whatever ruff's own defaults happen to be this version (one already changed under us mid-project).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "SIM115",  # "use a context manager for opening files": right for a long-lived handle, wrong for a one-shot read/write in a
               # short script or test, which is most of this codebase's style; the one real long-lived handle (runner.py's log
               # file) gets an explained noqa instead of bending every short script to this rule.
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["BLE001"]        # a test runner's own top-level except-and-report loop deliberately catches anything a test raises
"kit/guards/test_*.py" = ["BLE001"]
